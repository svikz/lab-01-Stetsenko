    <main class="page__main container">
        <section class="card">
            <h1>Зворотний зв'язок</h1>

            <form action="https://httpbin.org/post" method="post">

                <label for="name">Ім'я</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Електронна пошта</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Тема звернення</label>
                <select id="subject" name="subject" required>
                    <option value="question">Запитання</option>
                    <option value="suggestion">Пропозиція</option>
                    <option value="error">Повідомлення про помилку на сайті</option>
                </select>

                <label for="message">Текст повідомлення</label>
                <textarea id="message" name="message" rows="5" minlength="10" required></textarea>

                <label style="display: flex; align-items: center; gap: 8px; margin-bottom: var(--space-4);">
                    <input type="checkbox" name="consent" required style="margin: 0;">
                    Погоджуюсь на обробку персональних даних
                </label>

                <button type="submit" class="btn">Надіслати</button>

            </form>
        </section>
    </main>
